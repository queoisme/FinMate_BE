services:
  postgres-main:
    image: postgres:16
    environment:
      POSTGRES_DB: finmate_main
      POSTGRES_USER: finmate
      POSTGRES_PASSWORD: finmate
    ports:
      - "5433:5432"
    volumes:
      - postgres-main-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finmate -d finmate_main"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-ai:
    image: postgres:16
    environment:
      POSTGRES_DB: finmate_ai
      POSTGRES_USER: finmate
      POSTGRES_PASSWORD: finmate
    ports:
      - "5434:5432"
    volumes:
      - postgres-ai-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finmate -d finmate_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      # Container-network overrides — .env's localhost:5433/6379 values are for
      # host-based `dotnet run`, not for service-to-service DNS inside compose.
      DATABASE_URL: "Host=postgres-main;Port=5432;Database=finmate_main;Username=finmate;Password=finmate"
      REDIS_URL: "redis:6379"
      ASPNETCORE_ENVIRONMENT: "Development"
      # Có URL (và OCR_SERVICE_API_KEY trong backend/.env) thì backend điều phối quét hóa đơn: ocr-service đọc và lọc,
      # ai-service phân loại. Bỏ dòng này thì quét qua POST /api/v1/ocr của ai-service như trước.
      OCR_SERVICE_URL: "http://ocr-service:8000"
      # Có URL (và STT_SERVICE_API_KEY trong backend/.env) thì POST /api/v1/transactions/voice nghe được giọng nói.
      STT_SERVICE_URL: "http://stt-service:8000"
    ports:
      - "8080:8080"
      # /hangfire dashboard is served by this same process, no separate container
    # Push thật cần file service-account của Firebase. Bỏ comment hai dòng dưới và đặt
    # FCM_CREDENTIALS_PATH=/run/secrets/fcm.json trong backend/.env; không có nó thì backend
    # chạy log-only và mọi thứ khác vẫn hoạt động bình thường.
    # volumes:
    #   - ./backend/secrets/fcm-service-account.json:/run/secrets/fcm.json:ro
    depends_on:
      postgres-main:
        condition: service_healthy
      redis:
        condition: service_healthy
      ocr-service:
        condition: service_started
      stt-service:
        condition: service_started

  # Giọng nói → chữ (GIPFormer ONNX, CPU). KHÔNG mở cổng ra máy chủ: chỉ backend gọi, qua khóa STT_SERVICE_API_KEY
  # (giống nhau trong stt-service/.env và backend/.env). Audio chỉ đi qua bộ nhớ. Model (~258MB) đặt ở
  # stt-service/models/gipformer1.5-fp32/, mount vào /models (xem stt-service/README.md).
  stt-service:
    build:
      context: ./stt-service
    env_file:
      - ./stt-service/.env
    volumes:
      - ./stt-service/models:/models:ro

  # OCR hóa đơn (PaddleOCR + VietOCR). KHÔNG mở cổng ra máy chủ: chỉ backend và ai-service gọi được, qua mạng
  # nội bộ và khóa OCR_SERVICE_API_KEY. Ảnh chỉ đi qua bộ nhớ, không lưu ở đâu. Khóa nằm trong
  # ocr-service/.env, ai-service/.env và backend/.env (ba giá trị phải giống nhau), xem file .env.example của từng nơi.
  ocr-service:
    build:
      context: ./ocr-service
    env_file:
      - ./ocr-service/.env
    environment:
      # Dùng chung finmate_ai với ai-service (các bảng bill_*, do alembic 0006 của ai-service tạo). Không có DB riêng.
      FINMATE_DATABASE_URL: "postgresql://finmate:finmate@postgres-ai:5432/finmate_ai"
    depends_on:
      # Chờ ai-service healthy: nó chạy alembic lúc khởi động, nên các bảng bill_* có sẵn khi ocr-service nạp kiến thức.
      ai-service:
        condition: service_healthy

  # Rasa NLU: hiểu ý định + cắt số tiền của câu chat, cho POST /api/v1/chat/parse. Không mở cổng ra máy chủ:
  # chỉ ai-service gọi (RASA_URL). Rasa tắt thì ai-service vẫn trả lời bằng luật. Model đặt ở ai-service/rasa/models/.
  # Huấn luyện lại:  docker compose run --rm rasa train nlu --nlu data --config config.yml --domain domain.yml --out models --fixed-model-name finmate-nlu-v3
  rasa:
    image: rasa/rasa:3.6.21
    command: ["run", "--enable-api", "-m", "models/finmate-nlu-v8.tar.gz", "--port", "5005"]
    restart: unless-stopped
    volumes:
      - ./ai-service/rasa/models:/app/models
      - ./ai-service/rasa/config.yml:/app/config.yml:ro
      - ./ai-service/rasa/domain.yml:/app/domain.yml:ro
      - ./ai-service/rasa/data:/app/data:ro
      - ./ai-service/rasa/tests:/app/tests:ro

  ai-service:
    build:
      context: ./ai-service
    env_file:
      - ./ai-service/.env
    environment:
      DATABASE_URL: "postgresql+asyncpg://finmate:finmate@postgres-ai:5432/finmate_ai"
      REDIS_URL: "redis://redis:6379"
      MODEL_REGISTRY_PATH: "/models"
      # Có URL (và OCR_SERVICE_API_KEY trong ai-service/.env) thì /api/v1/ocr đọc hóa đơn qua ocr-service;
      # bỏ dòng này thì quay về Tesseract trong tiến trình ai-service.
      OCR_SERVICE_URL: "http://ocr-service:8000"
      # Rasa hiểu ý định câu chat; bỏ dòng này thì /api/v1/chat/parse chỉ dùng luật.
      RASA_URL: "http://rasa:5005"
    volumes:
      # Artifact model do scripts/train.py sinh ra. Mount thay vì COPY vào image: model
      # được promote mà không phải build lại, và model đã train không mất khi rebuild.
      - ./ai-service/models:/models
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres-ai:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-main-data:
  postgres-ai-data:
