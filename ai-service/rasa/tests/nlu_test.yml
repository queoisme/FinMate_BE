    - đổ xăng ở [Petrolimex](merchant) [100k](amount)
    - tiền điện [750 nghìn](amount)

- intent: add_income
  examples: |
    - nhận lương [13 củ](amount)
    - mẹ gửi cho [1 triệu](amount)
    - bán xe cũ được [5 củ](amount)
    - có thưởng tết [4 triệu](amount)

- intent: transfer_money
  examples: |
    - chuyển [3 triệu](amount) sang tài khoản tiết kiệm
    - rút [1 củ](amount) từ ví
    - chuyển khoản trả nợ [2 triệu](amount)

- intent: ask_spending
  examples: |
    - tháng này mình đã chi hết bao nhiêu
    - hôm nay tiêu bao nhiêu rồi nhỉ
    - tổng chi tuần này là bao nhiêu
    - tháng trước tôi chi bao nhiêu cho ăn uống
    - xem giúp mình chi tiêu hôm qua
    - tháng này tiền xăng hết bao nhiêu
    - cho mình biết tổng chi tiêu tháng 9
    - tuần này mua sắm hết bao nhiêu vậy

- intent: confirm
  examples: |
    - ừ đúng rồi đó
    - ok lưu nhé
    - chính xác luôn
    - đúng vậy ghi giúp mình

- intent: deny
  examples: |
    - không đúng rồi
    - sai danh mục rồi
    - không phải, tính vào ăn uống
    - nhầm rồi, là di chuyển

- intent: cancel
  examples: |
    - thôi hủy đi
    - bỏ khoản này đi
    - không ghi nữa nhé
    - hủy giúp mình

- intent: greet
  examples: |
    - chào bạn nhé
    - alo Mầm ơi
    - hello

- intent: goodbye
  examples: |
    - tạm biệt nhé
    - mình đi ngủ đây

- intent: out_of_scope
  examples: |
    - iphone mới giá hơn 20 triệu có đáng mua không
    - hôm nay trời mưa to quá
    - bạn có người yêu chưa
    - dạy mình làm bánh với
    - tỷ giá đô la hôm nay là bao nhiêu
    - kể cho mình nghe chuyện vui
    - nên mua nhà hay thuê nhà
    - lương 20 triệu có đủ sống không

- intent: add_income
