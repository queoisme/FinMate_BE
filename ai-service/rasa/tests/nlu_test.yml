version: "3.1"

# Bộ thử riêng cho NLU (KHÔNG dùng để huấn luyện): cách diễn đạt khác bộ học để đo công bằng.
nlu:
- intent: add_expense
  examples: |
    - sáng nay uống cà phê hết [32k](amount)
    - đổ bình xăng [70 cành](amount)
    - chiều đi chợ mua rau [90k](amount)
    - trưa ăn bún chả [55k](amount)
    - đi ăn lẩu [450k](amount) với team
    - mua cái áo [280k](amount)
    - đóng tiền nhà [3 củ](amount)
    - nay tiêu [120 nghìn](amount) ăn vặt
    - mua sắm [2 triệu](amount) cuối tuần
    - trả tiền wifi tháng này [210k](amount)
    - đi taxi sân bay [180k](amount)
    - mua thuốc ho [45k](amount)
    - xem phim [95k](amount) tối qua
    - tối nay nhậu [1 lít 5](amount)
    - gửi xe máy [3k](amount)
    - nạp game [200k](amount)
    - đặt [Grab](merchant) đi làm [48k](amount)
