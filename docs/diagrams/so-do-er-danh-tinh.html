<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sơ đồ ER — danh tính và thiết bị</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      line-height: 1.15;
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.85rem;
      color: var(--color-muted);
      margin-bottom: 1.75rem;
      max-width: 60ch;
    }
    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">FinMate · Mô hình dữ liệu · 5/5</p>
    <h1>Sơ đồ ER — danh tính và thiết bị</h1>
    <p class="sub">Bốn bảng vệ tinh quanh tài khoản: phiên đăng nhập còn hiệu lực, thiết bị nhận thông báo đẩy, hàng đợi xoá tài khoản, và nhật ký thao tác của quản trị viên.</p>

    <svg viewBox="0 0 784 860" role="img" aria-labelledby="er-dt-title er-dt-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="er-dt-title">Sơ đồ ER nhóm danh tính và thiết bị của FinMate</title>
      <desc id="er-dt-desc">Một tài khoản có nhiều refresh token và nhiều thiết bị nhận thông báo đẩy; cả hai khai khoá ngoại tới bảng người dùng và bị xoá theo khi tài khoản bị xoá vĩnh viễn. Hàng đợi xoá tài khoản và nhật ký kiểm toán cũng lưu mã người dùng nhưng cố ý không khai khoá ngoại, nên cả hai sống sót qua việc xoá tài khoản.</desc>

      <defs>
        <marker id="er-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ====================== QUAN HỆ ====================== -->

      <!-- R1. users 1—N refresh_tokens (ON DELETE CASCADE) -->
      <path d="M 312,348 H 368 Q 376,348 376,340 V 152 Q 376,144 384,144 H 456"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#er-arrow)"/>
      <text x="322" y="341" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">1</text>
      <text x="446" y="138" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">N</text>

      <!-- R2. users 1—N device_tokens (ON DELETE CASCADE) -->
      <path d="M 312,384 H 392 Q 400,384 400,376 V 336 Q 400,328 408,328 H 456"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#er-arrow)"/>
      <text x="322" y="377" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">1</text>
      <text x="446" y="322" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">N</text>

      <!-- R3. users ⋯ data_deletion_requests (không có khoá ngoại) -->
      <path d="M 312,420 H 408 Q 416,420 416,428 V 492 Q 416,500 424,500 H 456"
            fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="2,4" marker-end="url(#er-arrow)"/>
      <text x="322" y="413" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">1</text>
      <text x="446" y="494" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">N</text>

      <!-- R4. users ⋯ audit_logs (không có khoá ngoại) — một cầu vượt qua R3 -->
      <path d="M 312,456 H 424 Q 432,456 432,464 V 492 a 8,8 0 0,1 0,16 V 664 Q 432,672 440,672 H 456"
            fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="2,4" marker-end="url(#er-arrow)"/>
      <text x="322" y="449" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">1</text>
      <text x="446" y="666" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">N</text>

      <!-- ====================== THỰC THỂ ====================== -->

      <!-- users (đã vẽ ở sơ đồ lõi) -->
      <rect x="48" y="330" width="264" height="150" rx="6" fill="#f5f5f5"/>
      <rect x="48" y="330" width="264" height="150" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <line x1="48" y1="360" x2="312" y2="360" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="60" y="351" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">users</text>
      <text x="60" y="378" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"># id</text>
      <text x="60" y="396" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">email · UNIQUE</text>
      <text x="60" y="414" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">password_hash</text>
      <text x="60" y="432" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">google_id</text>
      <text x="60" y="450" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">role</text>
      <text x="60" y="468" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">deleted_at</text>

      <!-- refresh_tokens — THỰC THỂ TRUNG TÂM -->
      <rect x="456" y="72" width="280" height="150" rx="6" fill="#f5f5f5"/>
      <rect x="456" y="72" width="280" height="150" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <line x1="456" y1="102" x2="736" y2="102" stroke="rgba(235,108,54,0.30)" stroke-width="0.8"/>
      <text x="468" y="93" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">refresh_tokens</text>
      <text x="468" y="120" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"># id</text>
      <text x="468" y="138" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">→ user_id</text>
      <text x="468" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">token_hash · UNIQUE</text>
      <text x="468" y="174" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">expires_at</text>
      <text x="468" y="192" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">revoked_at</text>
      <text x="468" y="210" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">replaced_by_token_hash</text>

      <!-- device_tokens -->
      <rect x="456" y="262" width="280" height="132" rx="6" fill="#f5f5f5"/>
      <rect x="456" y="262" width="280" height="132" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <line x1="456" y1="292" x2="736" y2="292" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="468" y="283" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">device_tokens</text>
      <text x="468" y="310" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"># id</text>
      <text x="468" y="328" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">→ user_id</text>
      <text x="468" y="346" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">token · UNIQUE</text>
      <text x="468" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">platform</text>
      <text x="468" y="382" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">last_seen_at</text>

      <!-- data_deletion_requests -->
      <rect x="456" y="434" width="280" height="132" rx="6" fill="#f5f5f5"/>
      <rect x="456" y="434" width="280" height="132" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <line x1="456" y1="464" x2="736" y2="464" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="468" y="455" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">data_deletion_requests</text>
      <text x="468" y="482" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"># id</text>
      <text x="468" y="500" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">user_id</text>
      <text x="468" y="518" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">requested_at</text>
      <text x="468" y="536" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">scheduled_hard_delete_at</text>
      <text x="468" y="554" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">status</text>

      <!-- audit_logs -->
      <rect x="456" y="606" width="280" height="132" rx="6" fill="#f5f5f5"/>
      <rect x="456" y="606" width="280" height="132" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <line x1="456" y1="636" x2="736" y2="636" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="468" y="627" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">audit_logs</text>
      <text x="468" y="654" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"># id</text>
      <text x="468" y="672" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">user_id</text>
      <text x="468" y="690" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">event_type</text>
      <text x="468" y="708" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">metadata</text>
      <text x="468" y="726" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">ip_address</text>

      <!-- ====================== GHI CHÚ BIÊN TẬP ====================== -->
      <line x1="48" y1="520" x2="48" y2="594" stroke="#eb6c36" stroke-width="1.5"/>
      <text x="62" y="534" fill="#2d3142" font-size="13" font-style="italic" font-family="'Instrument Serif', serif">data_deletion_requests cố ý không khai</text>
      <text x="62" y="552" fill="#2d3142" font-size="13" font-style="italic" font-family="'Instrument Serif', serif">khoá ngoại: job xoá hẳn dòng users trước,</text>
      <text x="62" y="570" fill="#2d3142" font-size="13" font-style="italic" font-family="'Instrument Serif', serif">rồi mới đánh dấu yêu cầu đã xử lý. Có</text>
      <text x="62" y="588" fill="#2d3142" font-size="13" font-style="italic" font-family="'Instrument Serif', serif">cascade thì dòng yêu cầu biến mất trước.</text>

      <!-- ====================== CHÚ GIẢI ====================== -->
      <line x1="40" y1="782" x2="744" y2="782" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="804" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace"
            letter-spacing="0.14em">CHÚ GIẢI</text>

      <text x="152" y="804" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">#</text>
      <text x="168" y="804" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">khoá chính</text>

      <text x="272" y="804" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">→</text>
      <text x="288" y="804" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">khoá ngoại</text>

      <text x="400" y="804" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">1 · N</text>
      <text x="444" y="804" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">bản số quan hệ</text>

      <rect x="152" y="819" width="16" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="176" y="828" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">trọng tâm sơ đồ</text>

      <rect x="304" y="819" width="16" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="328" y="828" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">bảng đã vẽ ở sơ đồ lõi</text>

      <line x1="496" y1="824" x2="528" y2="824" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="536" y="828" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">khoá ngoại thật</text>

      <line x1="152" y1="848" x2="184" y2="848" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="2,4"/>
      <text x="192" y="852" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">liên kết logic, không có khoá ngoại</text>
    </svg>
  </div>
</body>
</html>
