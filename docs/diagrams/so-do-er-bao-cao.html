<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sơ đồ ER — báo cáo và phân tích</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      line-height: 1.15;
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.85rem;
      color: var(--color-muted);
      margin-bottom: 1.75rem;
      max-width: 60ch;
    }
    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">FinMate · Mô hình dữ liệu · 4/5</p>
    <h1>Sơ đồ ER — báo cáo và phân tích</h1>
    <p class="sub">Hai bảng không do người dùng ghi vào: tổng hợp theo ngày và nhận xét chi tiêu, đều được job nền dựng lại từ bảng giao dịch mỗi đêm.</p>

    <svg viewBox="0 0 1032 872" role="img" aria-labelledby="er-bc-title er-bc-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="er-bc-title">Sơ đồ ER nhóm báo cáo và phân tích của FinMate</title>
      <desc id="er-bc-desc">Bảng tổng hợp theo ngày và bảng nhận xét chi tiêu đều thuộc về một người dùng và trỏ tuỳ chọn tới một danh mục. Cả hai không nhận dữ liệu trực tiếp từ người dùng mà được hai job nền dựng lại từ bảng giao dịch: job tổng hợp chạy lúc không giờ năm phút và job sinh nhận xét lúc hai giờ sáng.</desc>

      <defs>
        <marker id="er-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ====================== QUAN HỆ ====================== -->

      <!-- R1. users 1—N daily_summaries -->
      <path d="M 248,248 H 312 Q 320,248 320,240 V 152 Q 320,144 328,144 H 392"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#er-arrow)"/>
      <text x="258" y="241" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">1</text>
      <text x="382" y="138" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">N</text>

      <!-- R2. users 1—N spending_insights -->
      <path d="M 248,304 H 328 Q 336,304 336,312 V 432 Q 336,440 344,440 H 392"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#er-arrow)"/>
      <text x="258" y="297" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">1</text>
      <text x="382" y="434" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">N</text>

      <!-- R3. categories 0..1—N daily_summaries (ON DELETE SET NULL) -->
      <path d="M 784,240 H 736 Q 728,240 728,232 V 160 Q 728,152 720,152 H 680"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#er-arrow)"/>
      <text x="774" y="233" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0..1</text>
      <text x="690" y="146" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">N</text>

      <!-- R4. categories 0..1—N spending_insights (ON DELETE SET NULL) -->
      <path d="M 784,296 H 752 Q 744,296 744,304 V 424 Q 744,432 736,432 H 680"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#er-arrow)"/>
      <text x="774" y="289" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0..1</text>
      <text x="690" y="426" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">N</text>

      <!-- R5. transactions ⋯> spending_insights (sinh bởi job, không phải khoá ngoại) -->
      <line x1="464" y1="616" x2="464" y2="552" stroke="#4f5d75" stroke-width="1.2"
            stroke-dasharray="2,4" marker-end="url(#er-arrow)"/>
      <rect x="472" y="578" width="140" height="12" rx="2" fill="#f5f5f5"/>
      <text x="476" y="587" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">InsightGeneratorJob · 02:00</text>

      <!-- R6. transactions ⋯> daily_summaries (sinh bởi job) — một cầu vượt qua R2 -->
      <path d="M 392,680 H 364 Q 356,680 356,672 V 448 a 8,8 0 0,0 0,-16 V 208 Q 356,200 364,200 H 392"
            fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="2,4" marker-end="url(#er-arrow)"/>
      <rect x="224" y="338" width="124" height="12" rx="2" fill="#f5f5f5"/>
      <text x="344" y="347" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">DailySummaryJob · 00:05</text>

      <!-- ====================== THỰC THỂ ====================== -->

      <!-- users (đã vẽ ở sơ đồ lõi) -->
      <rect x="48" y="216" width="200" height="114" rx="6" fill="#f5f5f5"/>
      <rect x="48" y="216" width="200" height="114" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <line x1="48" y1="246" x2="248" y2="246" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="60" y="237" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">users</text>
      <text x="60" y="264" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"># id</text>
      <text x="60" y="282" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">email</text>
      <text x="60" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">display_name</text>
      <text x="60" y="318" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">monthly_income_cents</text>

      <!-- categories (đã vẽ ở sơ đồ lõi) -->
      <rect x="784" y="216" width="200" height="114" rx="6" fill="#f5f5f5"/>
      <rect x="784" y="216" width="200" height="114" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <line x1="784" y1="246" x2="984" y2="246" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="796" y="237" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">categories</text>
      <text x="796" y="264" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"># id</text>
      <text x="796" y="282" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">→ user_id</text>
      <text x="796" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">slug</text>
      <text x="796" y="318" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">is_system</text>

      <!-- daily_summaries -->
      <rect x="392" y="88" width="288" height="168" rx="6" fill="#f5f5f5"/>
      <rect x="392" y="88" width="288" height="168" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <line x1="392" y1="118" x2="680" y2="118" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="404" y="109" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">daily_summaries</text>
      <text x="404" y="136" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"># id</text>
      <text x="404" y="154" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">→ user_id</text>
      <text x="404" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">summary_date</text>
      <text x="404" y="190" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">total_spent_cents</text>
      <text x="404" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">total_income_cents</text>
      <text x="404" y="226" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">→ top_category_id</text>
      <text x="404" y="244" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">transaction_count</text>

      <!-- spending_insights — THỰC THỂ TRUNG TÂM -->
      <rect x="392" y="384" width="288" height="168" rx="6" fill="#f5f5f5"/>
      <rect x="392" y="384" width="288" height="168" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <line x1="392" y1="414" x2="680" y2="414" stroke="rgba(235,108,54,0.30)" stroke-width="0.8"/>
      <text x="404" y="405" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">spending_insights</text>
      <text x="404" y="432" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"># id</text>
      <text x="404" y="450" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">→ user_id</text>
      <text x="404" y="468" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">insight_type</text>
      <text x="404" y="486" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">title</text>
      <text x="404" y="504" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">→ category_id</text>
      <text x="404" y="522" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">amount_cents</text>
      <text x="404" y="540" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">is_read</text>

      <!-- transactions (đã vẽ ở sơ đồ lõi) -->
      <rect x="392" y="616" width="288" height="132" rx="6" fill="#f5f5f5"/>
      <rect x="392" y="616" width="288" height="132" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <line x1="392" y1="646" x2="680" y2="646" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="404" y="637" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">transactions</text>
      <text x="404" y="664" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"># id</text>
      <text x="404" y="682" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">→ user_id</text>
      <text x="404" y="700" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">→ category_id</text>
      <text x="404" y="718" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">amount_cents</text>
      <text x="404" y="736" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">transacted_at</text>

      <!-- ====================== GHI CHÚ BIÊN TẬP ====================== -->
      <line x1="48" y1="420" x2="48" y2="494" stroke="#eb6c36" stroke-width="1.5"/>
      <text x="62" y="434" fill="#2d3142" font-size="13" font-style="italic" font-family="'Instrument Serif', serif">Hai bảng này là kết quả tính sẵn, không</text>
      <text x="62" y="452" fill="#2d3142" font-size="13" font-style="italic" font-family="'Instrument Serif', serif">phải dữ liệu gốc. Xoá sạch rồi chạy lại</text>
      <text x="62" y="470" fill="#2d3142" font-size="13" font-style="italic" font-family="'Instrument Serif', serif">hai job là dựng lại được toàn bộ từ</text>
      <text x="62" y="488" fill="#2d3142" font-size="13" font-style="italic" font-family="'Instrument Serif', serif">bảng transactions.</text>

      <!-- ====================== CHÚ GIẢI ====================== -->
      <line x1="40" y1="792" x2="992" y2="792" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="814" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace"
            letter-spacing="0.14em">CHÚ GIẢI</text>

      <text x="152" y="814" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">#</text>
      <text x="168" y="814" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">khoá chính</text>

      <text x="272" y="814" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">→</text>
      <text x="288" y="814" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">khoá ngoại</text>

      <text x="400" y="814" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">1 · N · 0..1</text>
      <text x="484" y="814" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">bản số quan hệ</text>

      <rect x="616" y="805" width="16" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="640" y="814" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">trọng tâm sơ đồ</text>

      <rect x="768" y="805" width="16" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="792" y="814" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">bảng đã vẽ ở sơ đồ lõi</text>

      <line x1="152" y1="834" x2="184" y2="834" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="192" y="838" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">khoá ngoại bắt buộc</text>

      <line x1="344" y1="834" x2="376" y2="834" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="384" y="838" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">khoá ngoại cho phép NULL</text>

      <line x1="584" y1="834" x2="616" y2="834" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="2,4"/>
      <text x="624" y="838" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">job nền dựng lại, không có khoá ngoại</text>
    </svg>
  </div>
</body>
</html>
