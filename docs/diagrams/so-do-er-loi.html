<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sơ đồ ER — nhóm nghiệp vụ lõi</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      line-height: 1.15;
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.85rem;
      color: var(--color-muted);
      margin-bottom: 1.75rem;
      max-width: 60ch;
    }
    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">FinMate · Mô hình dữ liệu</p>
    <h1>Sơ đồ ER — nhóm nghiệp vụ lõi</h1>
    <p class="sub">Bảy thực thể trên đường đi của Core Flow 1 và Flow 2: từ cấu hình ứng dụng ngân hàng, qua thông báo thu được và kết quả AI bóc tách, tới giao dịch chính thức.</p>

    <svg viewBox="0 0 1280 760" role="img" aria-labelledby="er-loi-title er-loi-desc" xmlns="http://www.w3.org/2000/svg">

      <desc id="er-loi-desc">Mô hình thực thể quan hệ gồm bảy bảng: người dùng sở hữu ví tiền, danh mục và giao dịch; mỗi ví gắn với một cấu hình nhà cung cấp và sinh ra các bản ghi thông báo ngân hàng; mỗi thông báo có đúng một kết quả phân tích của AI và có thể sinh ra một giao dịch nháp; giao dịch tham chiếu tới ví nguồn, ví đích khi chuyển khoản nội bộ, danh mục và thông báo gốc.</desc>

      <defs>
        <marker id="er-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ====================== QUAN HỆ (vẽ trước hộp) ====================== -->

      <!-- R5. provider_configs 1—N financial_accounts -->
      <line x1="264" y1="152" x2="368" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#er-arrow)"/>
      <text x="274" y="145" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">1</text>
      <text x="352" y="145" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">N</text>

      <!-- R6. financial_accounts 1—N notification_logs -->

      <text x="610" y="145" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">1</text>
      <text x="688" y="145" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">N</text>

      <!-- R9. notification_logs 1—1 ai_results -->

      <text x="993" y="145" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">1</text>

      <text x="426" y="262" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">N</text>

      <!-- R3. users 1—N notification_logs — ba cầu vượt qua R7, R8, R10 -->

      <text x="206" y="310" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">1</text>
      <text x="846" y="248" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">N</text>

      <text x="128" y="450" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">1</text>
      <text x="128" y="534" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">N</text>

      <!-- R11. categories 0..1—N transactions -->
      <line x1="264" y1="600" x2="512" y2="600" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#er-arrow)"/>
      <text x="274" y="593" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">0..1</text>
      <text x="496" y="593" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">N</text>

      <line x1="56" y1="350" x2="264" y2="350" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>

      <text x="68" y="368" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"># id</text>
