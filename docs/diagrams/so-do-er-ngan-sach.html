<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sơ đồ ER — ngân sách và mục tiêu</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      line-height: 1.15;
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.85rem;
      color: var(--color-muted);
      margin-bottom: 1.75rem;
      max-width: 60ch;
    }
    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">FinMate · Mô hình dữ liệu · 2/5</p>
    <h1>Sơ đồ ER — ngân sách và mục tiêu</h1>
    <p class="sub">Bốn bảng người dùng tự đặt ra: hạn mức chi theo danh mục, kỳ ngân sách mang ngưỡng cảnh báo, mục tiêu tiết kiệm và các lần góp tiền vào mục tiêu đó.</p>

    <svg viewBox="0 0 984 776" role="img" aria-labelledby="er-ns-title er-ns-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="er-ns-title">Sơ đồ ER nhóm ngân sách và mục tiêu của FinMate</title>
      <desc id="er-ns-desc">Người dùng sở hữu ngân sách và mục tiêu tiết kiệm. Mỗi ngân sách gắn tuỳ chọn với một danh mục — bỏ trống nghĩa là ngân sách tổng — và sinh ra nhiều kỳ ngân sách, mỗi kỳ mang hạn mức, số đã chi và ba mốc thời điểm đã gửi cảnh báo bảy mươi, chín mươi và một trăm phần trăm. Mỗi mục tiêu tiết kiệm có nhiều lần góp tiền, và một giao dịch có thể được gán tuỳ chọn về một mục tiêu.</desc>

      <defs>
        <marker id="er-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ====================== QUAN HỆ ====================== -->

      <!-- R1. users 1—N budgets -->
      <path d="M 248,304 H 312 Q 320,304 320,296 V 184 Q 320,176 328,176 H 344"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#er-arrow)"/>
      <text x="258" y="297" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">1</text>
      <text x="328" y="170" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">N</text>

      <!-- R2. categories 0..1—N budgets (NULL = ngân sách tổng) -->
      <line x1="248" y1="140" x2="344" y2="140" stroke="#4f5d75" stroke-width="1"
            stroke-dasharray="4,3" marker-end="url(#er-arrow)"/>
      <text x="258" y="133" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">0..1</text>
      <text x="316" y="133" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">N</text>

      <!-- R3. budgets 1—N budget_periods -->
      <line x1="576" y1="160" x2="664" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#er-arrow)"/>
      <text x="586" y="153" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">1</text>
      <text x="648" y="153" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">N</text>

      <!-- R4. users 1—N saving_goals -->
      <line x1="248" y1="368" x2="344" y2="368" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#er-arrow)"/>
      <text x="258" y="361" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">1</text>
      <text x="328" y="361" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">N</text>

      <!-- R5. saving_goals 1—N goal_contributions -->
      <line x1="576" y1="400" x2="664" y2="400" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#er-arrow)"/>
      <text x="586" y="393" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">1</text>
      <text x="648" y="393" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">N</text>

      <!-- R6. saving_goals 0..1—N transactions -->
      <path d="M 440,494 V 576 Q 440,584 432,584 H 248"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#er-arrow)"/>
      <text x="446" y="512" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">0..1</text>
      <text x="258" y="577" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">N</text>

      <!-- ====================== THỰC THỂ ====================== -->

      <!-- categories (đã vẽ ở sơ đồ lõi) -->
      <rect x="48" y="88" width="200" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="48" y="88" width="200" height="96" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <line x1="48" y1="118" x2="248" y2="118" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="60" y="109" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">categories</text>
      <text x="60" y="136" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"># id</text>
      <text x="60" y="154" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">→ user_id</text>
      <text x="60" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">slug</text>

      <!-- users (đã vẽ ở sơ đồ lõi) -->
      <rect x="48" y="280" width="200" height="114" rx="6" fill="#f5f5f5"/>
      <rect x="48" y="280" width="200" height="114" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <line x1="48" y1="310" x2="248" y2="310" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="60" y="301" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">users</text>
      <text x="60" y="328" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"># id</text>
      <text x="60" y="346" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">email</text>
      <text x="60" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">monthly_income_cents</text>
      <text x="60" y="382" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">created_at</text>

      <!-- transactions (đã vẽ ở sơ đồ lõi) -->
      <rect x="48" y="520" width="200" height="132" rx="6" fill="#f5f5f5"/>
      <rect x="48" y="520" width="200" height="132" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <line x1="48" y1="550" x2="248" y2="550" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="60" y="541" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">transactions</text>
      <text x="60" y="568" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"># id</text>
      <text x="60" y="586" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">→ user_id</text>
      <text x="60" y="604" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">→ category_id</text>
      <text x="60" y="622" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">→ saving_goal_id</text>
      <text x="60" y="640" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">amount_cents</text>

      <!-- budgets -->
      <rect x="344" y="88" width="232" height="150" rx="6" fill="#f5f5f5"/>
      <rect x="344" y="88" width="232" height="150" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <line x1="344" y1="118" x2="576" y2="118" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="356" y="109" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">budgets</text>
      <text x="356" y="136" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"># id</text>
      <text x="356" y="154" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">→ user_id</text>
      <text x="356" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">→ category_id</text>
      <text x="356" y="190" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">limit_cents</text>
      <text x="356" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">period_type</text>
      <text x="356" y="226" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">deleted_at</text>

      <!-- budget_periods — THỰC THỂ TRUNG TÂM -->
      <rect x="664" y="88" width="272" height="150" rx="6" fill="#f5f5f5"/>
      <rect x="664" y="88" width="272" height="150" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <line x1="664" y1="118" x2="936" y2="118" stroke="rgba(235,108,54,0.30)" stroke-width="0.8"/>
      <text x="676" y="109" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">budget_periods</text>
      <text x="676" y="136" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"># id</text>
      <text x="676" y="154" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">→ budget_id</text>
      <text x="676" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">period_start</text>
      <text x="676" y="190" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">limit_cents</text>
      <text x="676" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">spent_cents</text>
      <text x="676" y="226" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">alert_70/90/100_sent_at</text>

      <!-- saving_goals -->
      <rect x="344" y="344" width="232" height="150" rx="6" fill="#f5f5f5"/>
      <rect x="344" y="344" width="232" height="150" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <line x1="344" y1="374" x2="576" y2="374" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="356" y="365" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">saving_goals</text>
      <text x="356" y="392" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"># id</text>
      <text x="356" y="410" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">→ user_id</text>
      <text x="356" y="428" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">target_cents</text>
      <text x="356" y="446" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">saved_cents</text>
      <text x="356" y="464" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">status</text>
      <text x="356" y="482" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">deadline</text>

      <!-- goal_contributions -->
      <rect x="664" y="344" width="272" height="132" rx="6" fill="#f5f5f5"/>
      <rect x="664" y="344" width="272" height="132" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <line x1="664" y1="374" x2="936" y2="374" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="676" y="365" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">goal_contributions</text>
      <text x="676" y="392" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"># id</text>
      <text x="676" y="410" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">→ saving_goal_id</text>
      <text x="676" y="428" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">user_id</text>
      <text x="676" y="446" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">amount_cents</text>
      <text x="676" y="464" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">contributed_at</text>

      <!-- ====================== GHI CHÚ BIÊN TẬP ====================== -->
      <line x1="664" y1="266" x2="664" y2="312" stroke="#eb6c36" stroke-width="1.5"/>
      <text x="678" y="282" fill="#2d3142" font-size="13" font-style="italic" font-family="'Instrument Serif', serif">spent_cents do ứng dụng cộng trừ ngay khi ghi</text>
      <text x="678" y="302" fill="#2d3142" font-size="13" font-style="italic" font-family="'Instrument Serif', serif">giao dịch, không phải qua một khoá ngoại nào.</text>

      <!-- ====================== CHÚ GIẢI ====================== -->
      <line x1="40" y1="692" x2="944" y2="692" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="714" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace"
            letter-spacing="0.14em">CHÚ GIẢI</text>

      <text x="152" y="714" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">#</text>
      <text x="168" y="714" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">khoá chính</text>

      <text x="272" y="714" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">→</text>
      <text x="288" y="714" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">khoá ngoại</text>

      <text x="400" y="714" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">1 · N · 0..1</text>
      <text x="484" y="714" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">bản số quan hệ</text>

      <rect x="152" y="729" width="16" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="176" y="738" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">trọng tâm sơ đồ</text>

      <rect x="304" y="729" width="16" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="328" y="738" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">bảng đã vẽ ở sơ đồ lõi</text>

      <line x1="496" y1="734" x2="528" y2="734" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="536" y="738" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">khoá ngoại bắt buộc</text>

      <line x1="688" y1="734" x2="720" y2="734" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="728" y="738" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">khoá ngoại cho phép NULL</text>
    </svg>
  </div>
</body>
</html>
